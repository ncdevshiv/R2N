# Release CD: tags produce a real, tested GitHub Release with binary assets.
# Nothing is released that has not passed the full CI gate on main.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: r2n-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: r2n-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: r2n-macos-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # A release binary that fails tests is not a release.
      - name: Test release build
        run: cargo test --workspace

      - name: Smoke-test the binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/r2n"
          "$BIN" render examples/counter.r2n | grep -q "counter" || { echo "binary smoke test failed"; exit 1; }

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp "target/${{ matrix.target }}/release/r2n.exe" "dist/${{ matrix.artifact }}.exe"
          else
            cp "target/${{ matrix.target }}/release/r2n" "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  github-release:
    name: Publish release with provenance
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify the tag points at a green main commit
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit is not on main; releases must come from gated main history." >&2
            exit 1
          fi

      - name: Extract changelog for this tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Pull the section of docs/CHANGELOG.md matching this tag; fall back
          # to a generated body so a release is never silently empty.
          BODY=$(awk -v t="$TAG" '
            $0 == "## " t { found=1; next }
            found && /^## / { exit }
            found { print }
          ' docs/CHANGELOG.md 2>/dev/null || true)
          if [ -z "$BODY" ]; then
            BODY="Automated release for $TAG. See docs/CHANGELOG.md."
          fi
          printf '%s\n' "$BODY" > release-body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            dist/*

# Supply-chain audit: dependencies must stay explainable and vulnerability-free.
# Runs weekly and on manifest changes.
name: Supply Chain Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - ".github/workflows/supply-chain.yml"
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit || cargo install cargo-audit
      - name: Run audit
        run: cargo audit

  cargo-deny:
    name: cargo-deny (licenses + duplicates + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny || cargo install cargo-deny
      - name: Run license + ban checks
        run: cargo deny check licenses bans sources

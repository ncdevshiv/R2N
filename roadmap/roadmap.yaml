# R2N — React to Native — Roadmap
# Machine-readable source of truth. Keep in sync with index.html (interactive tracker).
# NOTE: 'done' flags below are the shipped baseline, not live progress.
project: "R2N — React to Native"
tagline: "Native compiler + runtime platform that executes existing React applications with zero JavaScript at runtime"
updated: 2026-08-30
project_start: 2026-08-29
horizon_weeks: 56
north_star: >-
  A native compatibility platform capable of compiling existing React/JSX applications into a JavaScript-runtime-free executable representation, while progressively compiling their dynamic behavior into specialized native code.

pillars:
  - name: "Existing React compatibility"
    text: "Accept real-world React/JSX applications unchanged. Behavioral compatibility, not API-presence compatibility."
  - name: "Zero JavaScript at runtime"
    text: "Production executes native/WASM artifacts. No JS engine, no Node.js, no JS execution in the shipped runtime."
  - name: "Optimization beyond React"
    text: "Compile known behavior into specialized native code — fast path when static analysis proves it, compatibility path otherwise."

compatibility_levels:
  - level: 0
    name: "JSX"
    detail: "Elements, attributes, children, expressions"
    milestone: "M0.3"
  - level: 1
    name: "React core"
    detail: "Components, hooks, reconciliation, context, suspense, portals"
    milestone: "M1"
  - level: 2
    name: "JavaScript language"
    detail: "Full ECMAScript semantics: closures, classes, async, modules"
    milestone: "M2"
  - level: 3
    name: "React ecosystem"
    detail: "Router, state, data, UI, animation libraries"
    milestone: "M6"
  - level: 4
    name: "Browser APIs"
    detail: "DOM events, timers, fetch, storage compat layer"
    milestone: "M6"
  - level: 5
    name: "Frameworks"
    detail: "Next.js/Vite-style app structures"
    milestone: "M6"
  - level: 6
    name: "Arbitrary production applications"
    detail: "Large existing repos run unchanged"
    milestone: "M7"

performance_targets:
  - tier: "Tier 1 — Compatibility runtime"
    startup: "1.5×"
    memory: "−10–20%"
    ui_updates: "≈ parity"
    cpu_workloads: "—"
  - tier: "Tier 2 — Native IR optimization"
    startup: "3–5×"
    memory: "−30–50%"
    ui_updates: "2–5×"
    cpu_workloads: "2–10×"
  - tier: "Tier 3 — Aggressive specialization"
    startup: "5–10×"
    memory: "−50–70%"
    ui_updates: "3–10×"
    cpu_workloads: "5–20×+"

benchmarks: ["Counter", "TodoMVC", "Large table", "10,000-row list", "Complex form", "Dashboard", "Animation-heavy UI", "Large component tree", "CPU-heavy app logic", "Real-world React apps"]


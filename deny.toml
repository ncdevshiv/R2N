# Cargo-deny policy: dependencies must be explainable.
# cargo deny check licenses bans sources (see .github/workflows/supply-chain.yml)

[licenses]
# The workspace is MIT OR Apache-2.0; deps must be permissive.
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
]

[bans]
# Keep the dependency tree small and intentional. Registry `*` wildcards are
# denied; intra-workspace path deps (which carry no version requirement by
# nature) are flagged as warnings only.
multiple-versions = "deny"
wildcards = "deny"

# Intra-workspace path dependencies have no version field by design.
[[bans.skip]]
crate_name = "r2n-ast"
[[bans.skip]]
crate_name = "r2n-cli"
[[bans.skip]]
crate_name = "r2n-compiler"
[[bans.skip]]
crate_name = "r2n-ir"
[[bans.skip]]
crate_name = "r2n-parser"
[[bans.skip]]
crate_name = "r2n-renderer-memory"
[[bans.skip]]
crate_name = "r2n-runtime"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "r2n-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "R2N command-line tool: compile, render, and dump artifacts"

[[bin]]
name = "r2n"
path = "src/main.rs"

[dependencies]
r2n-compiler = { path = "../r2n-compiler" , version = "0.1.0" }
r2n-ir = { path = "../r2n-ir" , version = "0.1.0" }
r2n-runtime = { path = "../r2n-runtime" , version = "0.1.0" }
r2n-renderer-memory = { path = "../r2n-renderer-memory" , version = "0.1.0" }
